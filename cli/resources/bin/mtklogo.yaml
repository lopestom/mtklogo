  # TheoLuc feat lopestorm
  # commit 9e4bfb5
# ---- Generic full-screen-only profiles (2026-10 survey of MediaTek devices) ----
# Full-screen sizes only: digits/animations differ per device, so add them in a device profile.
# Sizes are panel/LCM sizes from spec listings; the real LK logo size can differ by a few lines
# (e.g. 1600/1604/1612, 2400/2408/2412). Always confirm with: slot_bytes / (w*h*4) = integer.
# Confidence: A = seen on 2+ devices/listings, B = single listing (verify before relying on it).
# Keep 1218x2160 in its own profile: it has the same pixel count (2630880) as 1080x2436.
  - name: generic_phone_bgrabe
    # Phones (Helio P/G, Dimensity), 18:9 up to 1.5K, flips and unusual panels
    color_model: bgrabe
    formats:
    - { w: 720, h: 1440, t: "HD+ 18:9" }  # A: Helio A22/P22: Lenovo K9
    - { w: 720, h: 1520, t: "HD+ 19:9" }  # A: Helio P22/P35: Lenovo K11, LG K31, Oppo A12
    - { w: 720, h: 1560, t: "HD+" }  # A: Helio P22: Moto E6s, LG Q51, Oppo A1k
    - { w: 720, h: 1604, t: "HD+" }  # A: Helio G81 Ultra: Redmi 14C class
    - { w: 720, h: 1650, t: "HD+ 20.6:9" }  # A: Helio G85/G99: vivo Y-series, Duoqin F22 Pro
    - { w: 1080, h: 2160, t: "FHD+ 18:9" }  # A: Helio P60: Realme 1
    - { w: 1080, h: 2280, t: "FHD+ 19:9" }  # A: Helio P60: Oppo F7, Oppo A4
    - { w: 1080, h: 2372, t: "FHD+" }  # B: Dimensity 7300 Energy 6.57in
    - { w: 1080, h: 2392, t: "FHD+" }  # B: Dimensity 7300 6.77in
    - { w: 1084, h: 2392, t: "FHD+" }  # A: Nothing Phone 3a Lite
    - { w: 1080, h: 2412, t: "FHD+" }  # A: Redmi K70E (D8300)
    - { w: 1084, h: 2412, t: "FHD+" }  # A: Nothing Phone 2a / 3a Plus
    - { w: 1080, h: 2436, t: "FHD+" }  # A: Helio G99 Ultimate; Dimensity 7300/8300/8350. Same pixel count as profile 1218x2160
    - { w: 1216, h: 2640, t: "1.5K" }  # A: vivo X300 (D9500)
    - { w: 1224, h: 2720, t: "1.5K" }  # B: Dimensity 8350 Ultimate
    - { w: 1256, h: 2760, t: "1.5K" }  # A: Oppo Find X9 (D9500)
    - { w: 1260, h: 2800, t: "1.5K" }  # A: vivo X300 Pro, X200 class
    - { w: 1264, h: 2780, t: "1.5K" }  # B: 6.84in 144Hz class (Find X8 class), single listing
    - { w: 1272, h: 2772, t: "1.5K" }  # A: Oppo Find X9 Pro (D9500)
    - { w: 1272, h: 2800, t: "1.5K" }  # B: Dimensity 8350 Ultra 6.83in
    - { w: 1280, h: 2772, t: "1.5K" }  # A: Redmi K90 Max (D9500)
    - { w: 1080, h: 2640, t: "FHD+ flip" }  # A: Infinix Zero Flip main display (D8020)
    - { w: 1200, h: 2740, t: "flip" }  # B: Tecno Phantom V Flip 3
    - { w: 1080, h: 1200, t: "near-square" }  # A: Unihertz Titan 2 Elite
    - { w: 1440, h: 1440, t: "square" }  # A: Unihertz Titan 2
    - { w: 716, h: 720, t: "near-square" }  # B: Unihertz Titan Pocket (Helio P70)
    - { w: 750, h: 1334, t: "handheld" }  # A: Retroid Pocket 4 Pro (D1100)

