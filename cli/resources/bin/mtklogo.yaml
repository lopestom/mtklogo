# RMX2180 start - lopestorm
  # For devices with 720x1600 screens - zakelyk feat lopestorm
  # https://sourceforge.net/projects/rmx2180/files/Boot%20Logo/
  - name: realme_c15
    color_model: rgbale
    alias:
      - realme_c15
    formats:
      # Fullscreen logo (720x1600), 4 bytes per pixel → 4608000 bytes
      - { w: 720, h: 1600, t: "boot_logo" }
      # Digit '0' (36x50), 4 bpp → 7200 bytes
      - { w: 36, h: 50, t: "digit_0" }
      # Simbol % (28x28), 4 bpp → 3136 bytes
      - { w: 28, h: 28, t: "percent_symbol" }
# RMX2180 end - lopestorm
