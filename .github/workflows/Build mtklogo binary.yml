name: Build mtklogo binary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package_version:
    name: Read package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(awk '
            /^\[package\]$/ { section = "package"; next }
            /^\[workspace\.package\]$/ { section = "workspace.package"; next }
            /^\[/ { section = ""; next }
            section == "workspace.package" && /^version = / {
              value = $3
              gsub(/[" ]/, "", value)
              print value
              found = 1
              exit
            }
            section == "package" && /^version = / && !fallback {
              value = $3
              gsub(/[" ]/, "", value)
              fallback = value
            }
            END {
              if (!found && fallback) print fallback
            }
          ' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "Cargo package version must be present" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install the latest stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy,rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +stable test --workspace --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mtklogo-linux-x86_64
            executable: mtklogo
          - name: Windows x86-64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mtklogo-windows-x86_64
            executable: mtklogo.exe
          - name: Android arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            artifact: mtklogo-android-arm64-v8a
            executable: mtklogo

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install the latest stable Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update --target "${{ matrix.target }}"

      - name: Configure Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          toolchain="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/aarch64-linux-android21-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android21-clang"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android21-clang"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        run: cargo +stable build --release --locked --package mtklogo-cli --target "${{ matrix.target }}"

      - name: Stage artifact
        shell: bash
        run: |
          destination="dist/${{ matrix.artifact }}"
          mkdir -p "$destination"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$destination/"
          cp cli/resources/bin/mtklogo.yaml "$destination/"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release
    needs: [build, package_version]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mtklogo-*
          path: dist

      - name: Stage release assets
        shell: bash
        run: |
          mkdir release
          cp dist/mtklogo-linux-x86_64/mtklogo release/mtklogo-linux-x86_64
          cp dist/mtklogo-windows-x86_64/mtklogo.exe release/mtklogo-windows-x86_64.exe
          cp dist/mtklogo-android-arm64-v8a/mtklogo release/mtklogo-android-arm64-v8a
          cp dist/mtklogo-linux-x86_64/mtklogo.yaml release/mtklogo.yaml

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.package_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ steps.changelog.outputs.content }}

            ## mtklogo for Linux — Windows 10/11 — Android
            Compare the result with the attached `.sha256` file.
          files: |
            release/mtklogo-linux-x86_64
            release/mtklogo-windows-x86_64.exe
            release/mtklogo-android-arm64-v8a
            release/mtklogo.yaml
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
