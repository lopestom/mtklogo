name: Linux Engine

# Builds and tests the Rust engine (mtklogo_v1.1.0) whenever its files change.

on:
  push:
    paths:
      - "mtklogo_v1.1.0/**"
      - ".github/workflows/mtklogo_binary.yml"
  pull_request:
    paths:
      - "mtklogo_v1.1.0/**"
      - ".github/workflows/mtklogo_binary.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  engine:
    name: fmt · test · build  (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 ships 2.39.
        # Result in a binary that needs ≥ 2.34 (the smallest tested on users' machines).
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: mtklogo_v1.1.0

    steps:
      - uses: actions/checkout@v7

      # Rust edition 2024 requires rustc ≥ 1.85.
      - name: Install Rust toolchain (stable ≥ 1.85)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - name: Cache Cargo registry + build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            mtklogo_v1.1.0/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('mtklogo_v1.1.0/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo build --release --locked
        run: cargo build --release -p mtklogo-cli --locked

      - name: Smoke test
        run: |
          V=$(./target/release/mtklogo --version)
          echo "Built: $V"
          if [ "$V" != "mtklogo 1.1.0" ]; then echo "Unexpected version: $V"; exit 1; fi

      - name: Check maximum glibc symbol version (must be ≤ 2.34)
        if: runner.os == 'Linux'
        run: |
          MAX=$(objdump -T target/release/mtklogo \
                | grep -o 'GLIBC_[0-9.]*' \
                | sort -uV | tail -1)
          echo "max glibc required: $MAX"
          python3 -c "
          from functools import reduce; from operator import le
          parts = '$MAX'.lstrip('GLIBC_').split('.')
          limit = [2, 34]
          actual = [int(x) for x in parts[:len(limit)]]
          ok = actual <= limit
          print('glibc check:', 'PASS' if ok else 'FAIL', '$MAX', '<= 2.34?', ok)
          exit(0 if ok else 1)
          "

      - name: Upload mtklogo binary (ubuntu-24.04 only)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: mtklogo-linux-x86_64
          path: mtklogo_v1.1.0/target/release/mtklogo
          retention-days: 15
